name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    name: astro ${{ matrix.astro }}
    strategy:
      fail-fast: false
      matrix:
        # astro is a peer dependency (>=6): test the locked 7.x and the previous major
        astro: [locked, "6"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - if: matrix.astro != 'locked'
        run: npm install --no-save astro@${{ matrix.astro }}
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - if: matrix.astro == 'locked'
        run: npm run test:coverage
      - if: matrix.astro != 'locked'
        run: npm test
